name: Build & Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # OIDC handshake with AWS (no static keys)

# The live site runs the OPTIMIZED PRODUCTION build (node server.js), built
# locally ON the EC2 box from .env.production via docker-compose.prodlocal.yml.
# We deploy by SSM-running a git-pull + prod rebuild on the instance — no GHCR
# image and no NEXT_PUBLIC_* GitHub variables needed (NEXT_PUBLIC_* are baked at
# build time from .env.production, including NEXT_PUBLIC_VAPID_PUBLIC_KEY).
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SSM Run Command — git pull & prod rebuild
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters commands="[
              \"set -e\",
              \"cd /opt/forever\",
              \"git pull --ff-only origin main\",
              \"docker compose -f docker-compose.yml -f docker-compose.prodlocal.yml --env-file .env.production up -d --build app\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "ssm command id: $CMD_ID"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID"
          # Echo the actual stdout/stderr so the GHA log shows what happened on EC2
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status: Status, Out: StandardOutputContent, Err: StandardErrorContent}" \
            --output yaml
